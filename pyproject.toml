[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "code-review-skill"
version = "0.2.0"
requires-python = ">=3.9"

[project.optional-dependencies]
test = ["pytest>=7"]

# post_review.py lives in scripts/ and is a standalone module (no runtime deps).
[tool.setuptools]
py-modules = ["post_review"]
package-dir = { "" = "scripts" }

[tool.pytest.ini_options]
testpaths = ["tests"]
